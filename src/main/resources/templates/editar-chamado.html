<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Chamado - Medix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --medix-50: #FAF9F6;
            --medix-100: #E9F4F1;
            --medix-200: #CFE7E2;
            --medix-300: #A9D2C7;
            --medix-400: #7DBBAF;
            --medix-500: #52A897;
            --medix-600: #3A8F80;
            --medix-700: #2C6F64;
            --medix-800: #1E4F46;
            --medix-900: #122F29;
            --medix-error: #E45865;
        }

        body {
            background-color: var(--medix-50);
            color: var(--medix-900);
        }

        .bg-primary { background-color: var(--medix-600) !important; }
        .text-primary { color: var(--medix-700) !important; }

        .btn-success { background-color: var(--medix-600); border-color: var(--medix-600); color: white; }
        .btn-success:hover { background-color: var(--medix-700); border-color: var(--medix-700); color: white; }

        .btn-outline-secondary { color: var(--medix-700); border-color: var(--medix-300); }
        .btn-outline-secondary:hover { background-color: var(--medix-200); color: var(--medix-900); border-color: var(--medix-400); }

        .card { border: none; border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; }

        .form-control:focus, .form-select:focus {
            border-color: var(--medix-400);
            box-shadow: 0 0 0 0.25rem rgba(125, 187, 175, 0.25);
        }

        .alert-secondary {
            background-color: var(--medix-100);
            border-color: var(--medix-200);
            color: var(--medix-800);
        }

        .logo-medix {
            width: 35px;
            height: 35px;
            object-fit: cover;
            border: 2px solid white;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                    <div class="d-flex align-items-center gap-2">
                        <img th:src="@{/medix-logo.png}" alt="Logo" class="rounded-circle logo-medix">
                        <h5 class="mb-0 fw-bold">Atualizar Chamado #<span th:text="${chamado.idChamado}"></span></h5>
                    </div>
                    <a href="/" class="btn btn-sm btn-light text-primary fw-bold px-3 shadow-sm">Voltar</a>
                </div>
                <div class="card-body p-4">

                    <div class="alert alert-secondary mb-4 rounded-3">
                        <strong style="color: var(--medix-900);">Colaborador:</strong> <span th:text="${chamado.colaborador.nome}"></span><br>
                        <strong style="color: var(--medix-900);">Descrição original:</strong> <span th:text="${chamado.descricao}"></span>
                    </div>

                    <form th:action="@{/web/chamados/editar/{id}(id=${chamado.idChamado})}" method="post">

                        <div class="mb-4">
                            <label class="form-label fw-bold" style="color: var(--medix-800);">Novo Status</label>
                            <select class="form-select form-select-lg" name="status" required style="background-color: var(--medix-50);">
                                <option value="ABERTO" th:selected="${chamado.status == 'ABERTO'}">Aberto (Não Iniciado)</option>
                                <option value="EM_ATENDIMENTO" th:selected="${chamado.status == 'EM_ATENDIMENTO'}">Em Atendimento (Sendo Resolvido)</option>
                                <option value="CONCLUIDO" th:selected="${chamado.status == 'CONCLUIDO'}">Concluído (Problema Resolvido)</option>
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-bold" style="color: var(--medix-800);">Revisar Prioridade</label>
                            <select class="form-select" name="prioridade" required style="background-color: var(--medix-50);">
                                <option value="BAIXA" th:selected="${chamado.prioridade == 'BAIXA'}">Baixa</option>
                                <option value="MEDIA" th:selected="${chamado.prioridade == 'MEDIA'}">Média</option>
                                <option value="ALTA" th:selected="${chamado.prioridade == 'ALTA'}">Alta</option>
                            </select>
                        </div>

                        <div class="d-grid gap-3 d-md-flex justify-content-md-end border-top pt-4">
                            <a href="/" class="btn btn-outline-secondary fw-semibold px-4">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-bold px-5 shadow-sm">Salvar Alterações</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
