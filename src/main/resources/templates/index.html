<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medix - Suporte TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --medix-50: #FAF9F6;
            --medix-100: #E9F4F1;
            --medix-200: #CFE7E2;
            --medix-300: #A9D2C7;
            --medix-400: #7DBBAF;
            --medix-500: #52A897;
            --medix-600: #3A8F80;
            --medix-700: #2C6F64;
            --medix-800: #1E4F46;
            --medix-900: #122F29;
            --medix-error: #E45865;
        }

        body {
            background-color: var(--medix-50);
            color: var(--medix-900);
        }

        /* Sobrescrevendo o Bootstrap com as cores do Medix */
        .bg-primary { background-color: var(--medix-600) !important; }
        .text-primary { color: var(--medix-700) !important; }

        .btn-primary { background-color: var(--medix-600); border-color: var(--medix-600); color: white; }
        .btn-primary:hover { background-color: var(--medix-700); border-color: var(--medix-700); color: white; }

        .btn-outline-primary { color: var(--medix-600); border-color: var(--medix-600); }
        .btn-outline-primary:hover { background-color: var(--medix-600); color: white; }

        .btn-success { background-color: var(--medix-500); border-color: var(--medix-500); color: white;}
        .btn-success:hover { background-color: var(--medix-600); border-color: var(--medix-600); color: white;}

        .btn-danger, .bg-danger { background-color: var(--medix-error) !important; border-color: var(--medix-error) !important; }
        .btn-outline-danger { color: var(--medix-error); border-color: var(--medix-error); }
        .btn-outline-danger:hover { background-color: var(--medix-error); color: white; }

        .table-light th { background-color: var(--medix-100); color: var(--medix-800); border-bottom: 2px solid var(--medix-300);}
        .card { border: none; border-radius: 12px; }
        .card-header { border-bottom: 1px solid var(--medix-100); border-radius: 12px 12px 0 0 !important; }

        /* Foco nos inputs */
        .form-control:focus, .form-select:focus {
            border-color: var(--medix-400);
            box-shadow: 0 0 0 0.25rem rgba(125, 187, 175, 0.25);
        }

        /* Configuração do Logo */
        .logo-medix {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border: 2px solid var(--medix-300);
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row mb-4 align-items-center">
        <div class="col d-flex align-items-center gap-3">
            <img th:src="@{/medix-logo.png}" alt="Logo Medix" class="rounded-circle logo-medix shadow-sm">
            <div>
                <h2 class="text-primary fw-bold mb-0">Medix - Gestão de Chamados</h2>
                <p class="text-muted mb-0" style="color: var(--medix-700) !important;">Abertura e acompanhamento de tickets de suporte.</p>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold" style="color: var(--medix-800);">Abrir Novo Chamado</h5>
        </div>
        <div class="card-body">
            <form action="/web/chamados" method="post">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Colaborador</label>
                        <select class="form-select" name="idColaborador" required style="background-color: var(--medix-50);">
                            <option value="">Selecione o Colaborador...</option>
                            <option th:each="colab : ${colaboradores}"
                                    th:value="${colab.idColaborador}"
                                    th:text="${colab.nome} + ' (' + ${colab.setor} + ')'"></option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-semibold">Prioridade</label>
                        <select class="form-select" name="prioridade" required style="background-color: var(--medix-50);">
                            <option value="BAIXA">Baixa</option>
                            <option value="MEDIA" selected>Média</option>
                            <option value="ALTA">Alta</option>
                        </select>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-semibold">Descrição do Problema</label>
                        <input type="text" class="form-control" name="descricao" required placeholder="Ex: Monitor sem sinal" style="background-color: var(--medix-50);">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">Registrar Chamado</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold" style="color: var(--medix-800);">Chamados Recentes</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Colaborador</th>
                        <th>Setor</th>
                        <th>Descrição</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="chamado : ${chamados}">
                        <td class="ps-4 fw-bold" style="color: var(--medix-600);" th:text="'#' + ${chamado.idChamado}"></td>
                        <td th:text="${chamado.colaborador.nome}" class="fw-bold"></td>
                        <td th:text="${chamado.colaborador.setor}"></td>
                        <td th:text="${chamado.descricao}"></td>
                        <td>
                            <span class="badge bg-danger" th:if="${chamado.prioridade == 'ALTA'}">Alta</span>
                            <span class="badge bg-warning text-dark" th:if="${chamado.prioridade == 'MEDIA'}">Média</span>
                            <span class="badge bg-info text-dark" th:if="${chamado.prioridade == 'BAIXA'}">Baixa</span>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:if="${chamado.status == 'ABERTO'}">Aberto</span>
                            <span class="badge bg-primary" th:if="${chamado.status == 'EM_ATENDIMENTO'}">Em Atendimento</span>
                            <span class="badge bg-success" th:if="${chamado.status == 'CONCLUIDO'}">Concluído</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/web/chamados/editar/{id}(id=${chamado.idChamado})}" class="btn btn-sm btn-outline-primary fw-semibold px-3">Editar</a>

                                <form th:action="@{/web/chamados/deletar/{id}(id=${chamado.idChamado})}" method="post" onsubmit="return confirm('Tem certeza que deseja excluir este chamado?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger fw-semibold px-3">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(chamados)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <span style="font-size: 2rem; color: var(--medix-300);">📋</span><br>
                            Nenhum chamado registrado no momento.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
